name: 🐛 Bug report
description: Report a reproducible bug to help us improve the portal
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Before you file, please [search the issues](https://github.com/ceenobi/BCC007-Portal/issues?q=is%3Aissue) for an existing report.
        ⚠️ For security vulnerabilities, do **not** use this template — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: "e.g. When I try to transfer funds, the page spins forever and the transfer never completes."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps so we can reproduce it.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened, including error messages.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the app is affected?
      multiple: true
      options:
        - Auth / Onboarding
        - Payments / Dues
        - Transfers
        - Events
        - Tickets
        - Announcements
        - Expenses / Treasury
        - AI Assistant
        - Dashboard / Analytics
        - Search
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device
      description: Browser and OS (e.g. Chrome 126 on macOS, Safari on iPhone).
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Paste console output or attach screenshots if available.