name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24"
  MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries

jobs:
  check-source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce test branch only
        run: |
          if [ "${{ github.head_ref }}" != "test" ]; then
            echo "::error::PRs to main must come from the test branch only. Got: ${{ github.head_ref }}"
            exit 1
          fi

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack (Yarn 4)
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
      - run: yarn install --immutable
      - run: yarn typecheck

  biome-check:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack (Yarn 4)
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
      - run: yarn install --immutable
      - run: biome check --write --unsafe || true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack (Yarn 4)
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ runner.arch }}
      - run: yarn install --immutable
      - name: Run unit tests
        run: |
          set -o pipefail
          # Vitest 4 hangs during teardown due to open mongoose handles.
          # Run with a generous timeout; parse results from output if killed.
          timeout 540 yarn test --reporter=verbose > /tmp/vitest-out.txt 2>&1 || EXIT=$?
          tail -60 /tmp/vitest-out.txt
          if [ "${EXIT:-0}" -eq 124 ]; then
            # Killed by timeout — check if all tests actually passed
            if grep -qE 'Tests\s+[0-9]+ passed' /tmp/vitest-out.txt && ! grep -qE 'Tests\s+[0-9]+ failed' /tmp/vitest-out.txt; then
              echo "::notice::All tests passed (vitest teardown timed out — safe to ignore)"
              exit 0
            else
              echo "::error::Tests failed or incomplete"
              exit 1
            fi
          fi
          exit "${EXIT:-0}"

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack (Yarn 4)
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ runner.arch }}
      - run: yarn install --immutable
      - name: Run tests with coverage
        run: |
          timeout 600 yarn test:coverage > /tmp/coverage-out.txt 2>&1 || EXIT=$?
          if [ "${EXIT:-0}" -eq 124 ]; then
            if grep -qE 'Tests\s+[0-9]+ passed' /tmp/coverage-out.txt && ! grep -qE 'Tests\s+[0-9]+ failed' /tmp/coverage-out.txt; then
              echo "::notice::All tests passed (vitest teardown timed out — safe to ignore)"
              exit 0
            else
              echo "::error::Tests failed or incomplete"
              exit 1
            fi
          fi
          exit "${EXIT:-0}"
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack (Yarn 4)
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
      - run: yarn install --immutable
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e smoke tests
        run: yarn test:e2e
        env:
          CI: "true"
